[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/jamesponwith/ramp-graph"

[workspace.dependencies]
thiserror = "2.0.21"

# dev
divan = "0.1.21"
proptest = "1.11.0"
tempfile = "3.27.0"

[workspace.lints.rust]
# Groups.
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
# Safety.
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
# API hygiene.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
# Dead weight.
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unit_bindings = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "warn"
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
# Groups: everything but `restriction`, which is cherry-picked below.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# ── Restriction: panics & unsafe (a storage engine lives or dies on these) ──
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
multiple_unsafe_ops_per_block = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
indexing_slicing = "warn"
string_slice = "warn"
missing_asserts_for_indexing = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
mem_forget = "warn"
get_unwrap = "warn"

# ── Restriction: numeric correctness (on-disk formats = casts everywhere) ──
as_conversions = "warn"
as_underscore = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
suspicious_xor_used_as_pow = "warn"
precedence_bits = "warn"
non_zero_suggestions = "warn"

# ── Restriction: determinism & correctness ──
iter_over_hash_type = "warn"
wildcard_enum_match_arm = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
unused_result_ok = "warn"
assertions_on_result_states = "warn"
mixed_read_write_in_expression = "warn"
infinite_loop = "warn"
same_name_method = "warn"
renamed_function_params = "warn"
try_err = "warn"
error_impl_error = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
filetype_is_file = "warn"
verbose_file_reads = "warn"
large_include_file = "warn"

# ── Restriction: hygiene ──
allow_attributes = "warn"                  # use #[expect], which errors once the lint no longer fires
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
tests_outside_test_module = "warn"
cfg_not_test = "warn"
mod_module_files = "warn"
str_to_string = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
partial_pub_fields = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_chars_any = "warn"
unneeded_field_pattern = "warn"
unnecessary_self_imports = "warn"
needless_raw_strings = "warn"
pathbuf_init_then_push = "warn"
missing_assert_message = "warn"
return_and_then = "warn"
doc_include_without_cfg = "warn"

# ── Opt-outs (each with a reason) ──
redundant_pub_crate = "allow"     # conflicts with rustc's unreachable_pub
multiple_crate_versions = "allow" # cargo-deny owns duplicate detection
cargo_common_metadata = "allow"   # publish = false
option_if_let_else = "allow"      # often less readable than the match

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3 # fast deps (proptest, divan) in debug test runs

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only" # symbolicated profiles, no runtime cost

[profile.bench]
inherits = "release"

# Quick optimized builds while iterating on perf.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = true
